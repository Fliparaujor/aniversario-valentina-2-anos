<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aniversário do Josué · Sonic</title>
  <meta name="description" content="Corra com o Sonic pela Green Hill Zone e descubra o convite do aniversário do Josué.">
  <meta name="theme-color" content="#09142c">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sonic e o aniversário do Josué">
  <meta property="og:description" content="Uma fase secreta de Green Hill Zone. Jogue com o Sonic e desbloqueie o convite!">
  <meta property="og:url" content="https://fliparaujor.github.io/aniversario-valentina-2-anos/josue/">
  <meta property="og:image" content="https://fliparaujor.github.io/aniversario-valentina-2-anos/josue/assets/previa.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Convite jogável de Green Hill Zone com o Sonic. Aniversário do Josué.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://fliparaujor.github.io/aniversario-valentina-2-anos/josue/">
  <link rel="icon" href="assets/icone.png" type="image/png">
  <link rel="preload" href="assets/bitcount.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="fase.css?v=2">
  <script src="fase.js?v=2" defer></script>
</head>
<body>
  <main class="arcade" id="arcade" data-state="intro">
    <canvas id="stage" width="224" height="394" tabindex="-1" aria-label="Fase do Sonic. Use os controles na tela para correr e pular."></canvas>

    <div class="game-bar">
      <div class="wordmark" aria-label="Sonic">SONIC</div>
      <div class="hud" id="hud" hidden>
        <i class="hud-ring" aria-hidden="true"></i>
        <div class="hud-info">
          <span class="hud-label">Argolas</span>
          <div class="hud-progress" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        <output id="ring-count" aria-label="Argolas coletadas">0/4</output>
      </div>
      <div class="game-tools">
        <button class="icon-button" id="sound" type="button" aria-pressed="false" aria-label="Ativar som" title="Som">
          <span aria-hidden="true">♫</span>
        </button>
        <button class="icon-button fullscreen" id="full" type="button" aria-pressed="false" aria-label="Tela cheia" title="Tela cheia">
          <span class="fullscreen-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <section class="intro" id="intro" aria-labelledby="opening-title">
      <div class="intro-copy">
        <p class="zone"><i aria-hidden="true"></i>Green Hill Zone</p>
        <h1 id="opening-title"><span>Aniversário do</span><strong>Josué</strong></h1>
        <p class="mission">Corra com o Sonic e pegue as argolas para descobrir os detalhes da festa.</p>
      </div>
      <button class="button primary start" id="start" type="button"><span>Jogar</span><i class="play-arrow" aria-hidden="true"></i></button>
    </section>

    <button class="skip" id="skip" type="button">Ver convite <span aria-hidden="true">↗</span></button>

    <div class="clue" id="clue" aria-live="polite" aria-atomic="true">
      <span id="clue-label" class="clue-label"></span>
      <strong id="clue-text"></strong>
    </div>

    <div class="controller" id="controls" aria-label="Controles de toque" hidden>
      <div class="direction">
        <button type="button" class="control arrow left" data-input="left" aria-label="Correr para a esquerda"><i aria-hidden="true"></i></button>
        <button type="button" class="control arrow right" data-input="right" aria-label="Correr para a direita"><i aria-hidden="true"></i></button>
      </div>
      <button type="button" class="control jump" data-input="jump" aria-label="Pular"><i aria-hidden="true"></i><span>Pular</span></button>
    </div>

    <section class="result" id="result" aria-labelledby="event-title" hidden>
      <p class="result-kicker" id="result-kicker">Fase concluída!</p>
      <h2 id="event-title" tabindex="-1"><span>Aniversário do</span><strong>Josué</strong></h2>
      <dl class="event-details">
        <div><dt>Dia</dt><dd><time datetime="2026-11-22">Domingo, 22/11</time></dd></div>
        <div><dt>Hora</dt><dd><time datetime="2026-11-22T17:30:00-03:00">17h30</time></dd></div>
        <div class="location"><dt>Local</dt><dd>Praça do Meio do Mundo <span>Macapá, AP</span></dd></div>
      </dl>
    </section>

    <div id="actions" class="result-actions" hidden>
      <a class="button primary" href="https://www.google.com/maps/search/?api=1&amp;query=Parque%20Meio%20do%20Mundo%2C%20Macap%C3%A1%20AP" target="_blank" rel="noopener noreferrer">Abrir mapa <span aria-hidden="true">↗</span></a>
      <a class="button secondary" href="aniversario-do-josue.ics" download>Salvar na agenda</a>
      <button class="replay" id="replay" type="button">Jogar de novo <span aria-hidden="true">↻</span></button>
    </div>

    <noscript>
      <style>.arcade > :not(noscript) { display: none; }</style>
      <article class="no-js">
        <h1>Aniversário do Josué</h1>
        <p>Domingo, 22 de novembro, às 17h30.</p>
        <p>Praça do Meio do Mundo, Macapá, AP.</p>
        <a class="button primary" href="https://www.google.com/maps/search/?api=1&amp;query=Parque%20Meio%20do%20Mundo%2C%20Macap%C3%A1%20AP">Abrir mapa ↗</a>
      </article>
    </noscript>
  </main>
</body>
</html>
